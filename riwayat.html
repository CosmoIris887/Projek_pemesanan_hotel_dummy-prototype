<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Luxe Hotel - Riwayat Transaksi</title>
  <link rel="stylesheet" href="styles.css?v=1.1">
</head>

<body style="background-color: #0b0f19;">

  <div class="app-container">

    <!-- Shared header styling -->
    <header style="background-color: #121212;">
      <div class="nav-bar" style="padding: 0.75rem 2rem;">
        <div class="logo-section" id="navLogo">
          <div class="logo-icon">H</div>
          <span>Grand Luxe</span>
        </div>

        <div class="nav-actions">
          <button class="lang-switch" id="langToggle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" style="width:16px; height:16px;">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-.778.099-1.533.284-2.253" />
            </svg>
            <span id="langText">EN</span>
          </button>

          <div id="navAuthArea">
            <!-- Dynamic widget placeholder -->
          </div>
        </div>
      </div>
    </header>

    <!-- Main Grid Layout Container -->
    <div class="profile-page-container">

      <!-- LEFT SIDEBAR PANEL -->
      <aside class="profile-sidebar">
        <div>
          <h3 class="profile-sidebar-title" data-translate="mainMenu">Menu Utama</h3>
          <ul class="profile-menu-list">
            <li class="profile-menu-item" id="menuBeranda">
              <a href="profile.html">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
                <span data-translate="beranda">Beranda</span>
              </a>
            </li>
            <li class="profile-menu-item" id="menuPoints">
              <a href="#">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Grand Point</span>
              </a>
            </li>
            <li class="profile-menu-item active" id="menuRiwayat">
              <a href="riwayat.html">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span data-translate="riwayat">Riwayat</span>
              </a>
            </li>
            <li class="profile-menu-item" id="menuTopup">
              <a href="#">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75-3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" />
                </svg>
                <span data-translate="topUp">Top Up</span>
              </a>
            </li>
            <li class="profile-menu-item" id="menuLogout">
              <a href="#" style="color: var(--danger);">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                </svg>
                <span data-translate="logout">Logout</span>
              </a>
            </li>
          </ul>
        </div>
      </aside>

      <!-- RIGHT CONTENT PANEL -->
      <section class="profile-content">
        <h2 class="riwayat-title" data-translate="riwayat">Riwayat</h2>

        <div class="riwayat-card">
          <!-- Search input card system -->
          <div class="search-riwayat-container">
            <input type="text" id="searchInput" placeholder="Pencarian" class="search-riwayat-input">
            <button id="searchBtn" class="search-riwayat-btn">CARI</button>
          </div>

          <!-- Transaction list table -->
          <div class="riwayat-table-wrapper">
            <table class="riwayat-table">
              <thead>
                <tr>
                  <th>No Transaksi</th>
                  <th>Produk</th>
                  <th>ID User</th>
                  <th>Harga</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="transactionTableBody">
                <!-- Loaded dynamically by app.js -->
              </tbody>
            </table>
          </div>
        </div>

      </section>

    </div>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Grand Luxe Hotel Group. All rights reserved. Serviced via Front-End integration.</p>
    </footer>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>

</html>
